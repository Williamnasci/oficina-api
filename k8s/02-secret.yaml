apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
# DATABASE_URL não fica aqui: é injetada pela pipeline de deploy a partir do
# Secrets Manager (oficina/database/credentials), depois deste apply, para não
# commitar a credencial real do RDS neste repositório. Ver .github/workflows/ci-cd.yml.
stringData:
  JWT_SECRET: supersecretkey
  AUTH_DEMO_PASSWORD: admin
  STATUS_NOTIFICATION_WEBHOOK_URL: ""
