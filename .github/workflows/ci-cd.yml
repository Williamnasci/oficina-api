name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Sem isso, um push em main (deploy automatico) e um workflow_dispatch manual
# quase simultaneos rodam o job de deploy em paralelo contra o MESMO
# cluster/release do Helm - reproduzido na pratica: dois "helm upgrade
# --install datadog-agent" concorrentes, um deles falhando com "UPGRADE
# FAILED: release: already exists". cancel-in-progress=false enfileira em
# vez de cancelar um deploy ja em andamento (cancelar no meio podia deixar o
# cluster num estado pior do que a corrida original). O group inclui
# github.ref para nao serializar PRs de branches diferentes entre si.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCAL_IMAGE_NAME: oficina-tech-challenge
  DOCKERHUB_IMAGE_NAME: oficina-tech-challenge

jobs:
  quality:
    name: Build and tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oficina_db?schema=public
      JWT_SECRET: test-secret
      JWT_EXPIRES_IN: 1d
      AUTH_DEMO_USERNAME: admin
      AUTH_DEMO_PASSWORD: admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Run automated tests
        run: npm test -- --runInBand

  docker:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        run: docker build -t ${{ env.LOCAL_IMAGE_NAME }}:${{ github.sha }} .

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.LOCAL_IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          docker tag ${{ env.LOCAL_IMAGE_NAME }}:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKERHUB_IMAGE_NAME }}:${{ github.sha }}

  security:
    name: Trivy security scan
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image for scan
        run: docker build -t ${{ env.LOCAL_IMAGE_NAME }}:security-scan .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE_NAME }}:security-scan
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'

  kubernetes-validate:
    name: Kubernetes manifests validation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s

  deploy:
    name: Deploy to Kubernetes
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    needs: [docker, kubernetes-validate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Kubernetes (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE_NAME: ${{ env.DOCKERHUB_IMAGE_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_DEMO_PASSWORD: ${{ secrets.AUTH_DEMO_PASSWORD }}
          STATUS_NOTIFICATION_WEBHOOK_URL: ${{ secrets.STATUS_NOTIFICATION_WEBHOOK_URL }}
        run: |
          $kubeConfig = $env:KUBE_CONFIG
          $dockerhubUsername = $env:DOCKERHUB_USERNAME

          if ($kubeConfig) {
              Write-Host "Configurando credenciais do cluster remoto..."
              $kubeDir = Join-Path $env:USERPROFILE ".kube"
              if (-not (Test-Path $kubeDir)) {
                  New-Item -Path $kubeDir -ItemType Directory -Force
              }
              $kubeConfigFile = Join-Path $kubeDir "config"
              $utf8NoBom = New-Object System.Text.UTF8Encoding $false
              [System.IO.File]::WriteAllText($kubeConfigFile, $kubeConfig, $utf8NoBom)
          } else {
              Write-Host "KUBE_CONFIG não informado; usando o contexto Kubernetes do runner."
          }

          # Check if kubectl cluster-info runs successfully
          kubectl cluster-info
          if ($LASTEXITCODE -ne 0) {
              Write-Error "Nenhum cluster Kubernetes acessível. Configure KUBE_CONFIG para um cluster remoto ou DEPLOY_RUNNER=self-hosted para usar o cluster local do runner."
              exit 1
          }

          $username = $dockerhubUsername
          if (-not $username) {
              $username = "williamnasci"
          }

          $image = "${username}/${env:DOCKERHUB_IMAGE_NAME}:${{ github.sha }}"

          Write-Host "Aplicando manifestos no cluster Kubernetes..."
          kubectl apply -k k8s

          Write-Host "Aplicando o secret oficina-secrets por completo, a partir dos GitHub Secrets (nao versionado no repositorio)..."
          kubectl create secret generic oficina-secrets -n oficina `
            --from-literal=DATABASE_URL="$env:DATABASE_URL" `
            --from-literal=JWT_SECRET="$env:JWT_SECRET" `
            --from-literal=AUTH_DEMO_PASSWORD="$env:AUTH_DEMO_PASSWORD" `
            --from-literal=STATUS_NOTIFICATION_WEBHOOK_URL="$env:STATUS_NOTIFICATION_WEBHOOK_URL" `
            --dry-run=client -o yaml | kubectl apply -f -

          Write-Host "Atualizando imagem do Deployment para $image..."
          kubectl set image deployment/oficina-api "oficina-api=$image" "prisma-migrate=$image" -n oficina
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          # kubectl set image so reinicia os pods se a imagem mudar. Como o
          # secret oficina-secrets pode ter sido rotacionado sem mudanca de
          # imagem (ex: rerun de workflow, rotacao manual de senha), forcamos
          # sempre um rollout restart para os pods relerem o secret atual.
          Write-Host "Forcando rollout restart para os pods relerem o secret atual..."
          kubectl rollout restart deployment/oficina-api -n oficina
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          Write-Host "Aguardando o rollout da API Oficina..."
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

      - name: Deploy to Kubernetes (Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE_NAME: ${{ env.DOCKERHUB_IMAGE_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AUTH_DEMO_PASSWORD: ${{ secrets.AUTH_DEMO_PASSWORD }}
          STATUS_NOTIFICATION_WEBHOOK_URL: ${{ secrets.STATUS_NOTIFICATION_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [ -n "${KUBE_CONFIG:-}" ]; then
              echo "Configurando credenciais do cluster remoto..."
              mkdir -p "${HOME}/.kube"
              printf '%s' "${KUBE_CONFIG}" > "${HOME}/.kube/config"
          else
              echo "KUBE_CONFIG não informado; usando o contexto Kubernetes do runner."
          fi

          kubectl cluster-info || {
              echo "Nenhum cluster Kubernetes acessível. Configure KUBE_CONFIG para um cluster remoto ou DEPLOY_RUNNER=self-hosted para usar o cluster local do runner." >&2
              exit 1
          }

          username="${DOCKERHUB_USERNAME:-williamnasci}"
          image="${username}/${DOCKERHUB_IMAGE_NAME}:${{ github.sha }}"

          echo "Aplicando manifestos no cluster Kubernetes..."
          kubectl apply -k k8s

          echo "Aplicando o secret oficina-secrets por completo, a partir dos GitHub Secrets (nao versionado no repositorio)..."
          kubectl create secret generic oficina-secrets -n oficina \
            --from-literal=DATABASE_URL="${DATABASE_URL}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=AUTH_DEMO_PASSWORD="${AUTH_DEMO_PASSWORD}" \
            --from-literal=STATUS_NOTIFICATION_WEBHOOK_URL="${STATUS_NOTIFICATION_WEBHOOK_URL:-}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Atualizando imagem do Deployment para ${image}..."
          kubectl set image deployment/oficina-api "oficina-api=${image}" "prisma-migrate=${image}" -n oficina

          # kubectl set image so reinicia os pods se a imagem mudar. Como o
          # secret oficina-secrets pode ter sido rotacionado sem mudanca de
          # imagem (ex: rerun de workflow, rotacao manual de senha), forcamos
          # sempre um rollout restart para os pods relerem o secret atual.
          echo "Forcando rollout restart para os pods relerem o secret atual..."
          kubectl rollout restart deployment/oficina-api -n oficina

          echo "Aguardando o rollout da API Oficina..."
          kubectl rollout status deployment/oficina-api -n oficina --timeout=180s

      - name: Setup Helm
        if: runner.os != 'Windows'
        uses: azure/setup-helm@v4

      - name: Deploy Datadog Agent
        if: runner.os != 'Windows'
        shell: bash
        env:
          KUBECONFIG: /home/runner/.kube/config
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${DATADOG_API_KEY:-}" ]; then
              # ::warning:: em vez de so um echo - fica visivel no resumo do
              # run no GitHub Actions, nao so escondido no log do step. Ja
              # aconteceu do secret existir mas com valor vazio (paste
              # interativo do gh secret set falhando silenciosamente) e o
              # deploy "passar" sem ninguem notar que a observabilidade
              # ficou fora do ar.
              echo "::warning::DATADOG_API_KEY nao configurado (ou vazio) - pulando deploy do Datadog Agent. A aplicacao vai subir sem APM/logs/metricas no Datadog."
              exit 0
          fi

          echo "Instalando/atualizando o Datadog Agent via Helm..."
          helm repo add datadog https://helm.datadoghq.com
          helm repo update

          # clusterAgent desabilitado: cluster single-node pequeno (t3.small,
          # Free Tier) nao precisa de agregacao cluster-wide (kube-state-
          # metrics etc) so pra este projeto academico - metricas de
          # host/pod (kubelet) e os logs/traces do proprio Agent ja cobrem
          # o que o desafio pede. kubelet.tlsVerify=false pelo mesmo motivo
          # do metrics-server: certificado self-signed do Kind.
          helm upgrade --install datadog-agent datadog/datadog \
            --namespace datadog --create-namespace \
            --set datadog.apiKey="${DATADOG_API_KEY}" \
            --set datadog.site="us5.datadoghq.com" \
            --set datadog.kubelet.tlsVerify=false \
            --set datadog.logs.enabled=true \
            --set datadog.logs.containerCollectAll=true \
            --set datadog.apm.portEnabled=true \
            --set datadog.prometheusScrape.enabled=true \
            --set clusterAgent.enabled=false \
            --set agents.containers.agent.resources.requests.cpu=100m \
            --set agents.containers.agent.resources.requests.memory=256Mi \
            --set agents.containers.agent.resources.limits.memory=512Mi \
            --wait --timeout 5m


